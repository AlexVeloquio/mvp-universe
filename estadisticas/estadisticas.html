<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Estadísticas Liga Veteranos 49+ | MVP UNIVERSE</title>
    
    <meta name="description" content="Estadísticas en vivo de la Liga Veteranos 49+ - MVP Universe">
    <meta name="keywords" content="estadísticas basketball, liga veteranos, MVP Universe, tabla posiciones">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="../logos/MVP_LOGO.png" />
    
    <style>
        :root {
            --mvp-orange: #e64225;
            --mvp-blue: #1e3c72;
            --mvp-blue-light: #2a5298;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-top: 80px;
            min-height: 100vh;
        }
        
        /* NAVBAR */
        .navbar-stats {
            background: linear-gradient(135deg, var(--mvp-blue), var(--mvp-blue-light));
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .navbar-brand img {
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
        }
        
        /* HEADER PRINCIPAL */
        .stats-header {
            background: linear-gradient(135deg, var(--mvp-blue), var(--mvp-blue-light));
            color: white;
            padding: 40px 0;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }
        
        .stats-header h1 {
            font-size: 2.5rem;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        
        .stats-header .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        /* TABS */
        .stats-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .stat-tab {
            background: white;
            color: var(--mvp-blue);
            border: 2px solid var(--mvp-blue);
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .stat-tab:hover {
            background: var(--mvp-blue);
            color: white;
            transform: translateY(-2px);
        }
        
        .stat-tab.active {
            background: var(--mvp-orange);
            border-color: var(--mvp-orange);
            color: white;
        }
        
        /* CONTENEDORES DE CONTENIDO */
        .tab-content-container {
            display: none;
        }
        
        .tab-content-container.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* TARJETAS */
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
        }
        
        .stat-card h3 {
            color: var(--mvp-blue);
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--mvp-orange);
            padding-bottom: 10px;
        }
        
        /* TABLA DE POSICIONES */
        .positions-table {
            width: 100%;
            overflow-x: auto;
        }
        
        .positions-table table {
            width: 100%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .positions-table thead {
            background: linear-gradient(135deg, var(--mvp-blue), var(--mvp-blue-light));
            color: white;
        }
        
        .positions-table th {
            padding: 15px 10px;
            font-weight: 600;
            text-align: center;
            font-size: 0.9rem;
        }
        
        .positions-table td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .positions-table tbody tr:hover {
            background: #f8f9fa;
        }
        
        .positions-table .pos {
            font-weight: 700;
            color: var(--mvp-orange);
            font-size: 1.1rem;
        }
        
        .positions-table .team-name {
            text-align: left;
            font-weight: 600;
            color: var(--mvp-blue);
        }
        
        /* PRÓXIMOS PARTIDOS */
        .match-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .match-card:hover {
            transform: translateX(5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        
        .match-date {
            background: var(--mvp-orange);
            color: white;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .match-teams {
            flex: 1;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--mvp-blue);
        }
        
        .vs {
            color: var(--mvp-orange);
            font-weight: 700;
            margin: 0 10px;
        }
        
        /* LÍDERES ANOTADORES */
        .leader-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        .leader-item:hover {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            transform: translateX(5px);
        }
        
        .leader-rank {
            width: 40px;
            height: 40px;
            background: var(--mvp-orange);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            margin-right: 15px;
        }
        
        .leader-rank.gold {
            background: linear-gradient(135deg, #FFD700, #FFA500);
        }
        
        .leader-rank.silver {
            background: linear-gradient(135deg, #C0C0C0, #808080);
        }
        
        .leader-rank.bronze {
            background: linear-gradient(135deg, #CD7F32, #8B4513);
        }
        
        .leader-info {
            flex: 1;
        }
        
        .leader-name {
            font-weight: 700;
            color: var(--mvp-blue);
            font-size: 1.1rem;
        }
        
        .leader-team {
            color: #666;
            font-size: 0.9rem;
        }
        
        .leader-stats {
            text-align: right;
        }
        
        .leader-points {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--mvp-orange);
        }
        
        .leader-avg {
            font-size: 0.85rem;
            color: #666;
        }
        
        /* LOADING */
        .loading {
            text-align: center;
            padding: 60px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--mvp-orange);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* RESULTADOS */
        .result-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        
        .result-score {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 15px 0;
        }
        
        .team-score {
            text-align: center;
            flex: 1;
        }
        
        .team-score .name {
            font-weight: 600;
            color: var(--mvp-blue);
            margin-bottom: 5px;
        }
        
        .team-score .score {
            font-size: 2rem;
            font-weight: 700;
            color: var(--mvp-orange);
        }
        
        .team-score.winner .score {
            color: #28a745;
        }
        
        .score-divider {
            font-size: 1.5rem;
            color: #999;
            font-weight: 300;
        }
        
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .stats-header h1 {
                font-size: 1.8rem;
            }
            
            .stat-tab {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
            
            .positions-table th,
            .positions-table td {
                padding: 8px 5px;
                font-size: 0.85rem;
            }
            
            .match-card {
                flex-direction: column;
                gap: 10px;
            }
            
            .leader-points {
                font-size: 1.2rem;
            }
        }

        /* Selector de Liga */
        .liga-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .liga-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .liga-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .liga-btn.active {
            background: var(--mvp-orange);
            border-color: var(--mvp-orange);
            box-shadow: 0 4px 15px rgba(230, 66, 37, 0.4);
        }

        /* Sección de Equipos */
        .equipos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .equipo-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            border-left: 5px solid var(--mvp-orange);
        }

        .equipo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .equipo-header {
            background: linear-gradient(135deg, var(--mvp-blue), var(--mvp-blue-light));
            color: white;
            padding: 20px;
            text-align: center;
        }

        .equipo-nombre {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
        }

        .equipo-total {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        .jugadores-table {
            width: 100%;
            border-collapse: collapse;
        }

        .jugadores-table thead {
            background: #f8f9fa;
        }

        .jugadores-table th {
            padding: 12px 8px;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--mvp-blue);
            border-bottom: 2px solid #dee2e6;
        }

        .jugadores-table td {
            padding: 10px 8px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.9rem;
        }

        .jugadores-table tbody tr:hover {
            background: #f8f9fa;
        }

        .jugador-numero {
            width: 50px;
            text-align: center;
            font-weight: 700;
            color: var(--mvp-orange);
        }

        .jugador-nombre {
            font-weight: 600;
            color: var(--mvp-blue);
        }

        .jugador-puntos {
            text-align: center;
            font-weight: 700;
            color: var(--mvp-orange);
            font-size: 1.1rem;
        }

        .jugador-porcentaje {
            text-align: center;
        }

        .porcentaje-bar {
            width: 100%;
            background: #e9ecef;
            border-radius: 10px;
            height: 8px;
            overflow: hidden;
        }

        .porcentaje-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--mvp-orange), #ff6b3d);
            transition: width 0.3s ease;
        }

        .porcentaje-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: #666;
            margin-top: 3px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .liga-selector {
                flex-direction: column;
            }
            
            .liga-btn {
                width: 100%;
            }
            
            .equipos-grid {
                grid-template-columns: 1fr;
            }
            
            .jugadores-table th,
            .jugadores-table td {
                padding: 8px 4px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>
    <h1>PÁGINA EN MANTENIMIENTO</h1>
</body>
</html>
